<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#362f3d" flood-opacity="0.18"/>
    </filter>
    <filter id="symbolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="14" y="14" width="484" height="484" rx="115" fill="#fffdf8" stroke="#e1d7c8" stroke-width="9" filter="url(#tileShadow)"/>

  <!-- Crown -->
  <g filter="url(#symbolShadow)">
    <polygon points="204,155 196,113 232,137 256,100 280,137 316,113 308,155" fill="#f59e0b"/>
    <circle cx="196" cy="113" r="6" fill="#fef08a"/>
    <circle cx="256" cy="100" r="6" fill="#fef08a"/>
    <circle cx="316" cy="113" r="6" fill="#fef08a"/>
  </g>

  <!-- O Symbol (Green) -->
  <g filter="url(#symbolShadow)">
    <circle cx="168" cy="280" r="68" fill="none" stroke="#10b981" stroke-width="44"/>
    <circle cx="168" cy="280" r="86" fill="none" stroke="#34d399" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- X Symbol (Red) -->
  <g filter="url(#symbolShadow)">
    <line x1="276" y1="212" x2="412" y2="348" stroke="#ef4444" stroke-width="44" stroke-linecap="round"/>
    <line x1="276" y1="348" x2="412" y2="212" stroke="#ef4444" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>
