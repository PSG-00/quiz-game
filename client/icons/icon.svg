<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4a3b32" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#e6d8c3" stroke-width="6"/>

  <!-- Center Card Area with shadow -->
  <g filter="url(#shadow)">
    <!-- O symbol on left -->
    <circle cx="185" cy="235" r="75" fill="none" stroke="url(#oGrad)" stroke-width="36"/>
    <!-- X symbol on right -->
    <path d="M 285 160 L 395 310 M 395 160 L 285 310" stroke="url(#xGrad)" stroke-width="36" stroke-linecap="round"/>
  </g>

  <!-- Crown / Badge on top -->
  <path d="M 226 125 L 246 150 L 256 120 L 266 150 L 286 125 L 280 165 L 232 165 Z" fill="#f59e0b" filter="url(#shadow)"/>

  <!-- Text: 모두의 퀴즈 -->
  <text x="256" y="415" font-family="'Pretendard', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#362f3d" text-anchor="middle" letter-spacing="2">모두의 퀴즈</text>
  <text x="256" y="455" font-family="'Pretendard', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#8c7b70" text-anchor="middle" letter-spacing="4">SURVIVAL QUIZ</text>
</svg>
