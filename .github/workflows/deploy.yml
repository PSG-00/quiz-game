name: Deploy to GCP Self-Hosted Runner

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Preserve live quiz data before clean checkout
        shell: bash
        run: |
          umask 077
          quiz_backup_dir="$(mktemp -d "$RUNNER_TEMP/quiz-data.XXXXXX")"
          echo "QUIZ_DATA_BACKUP=$quiz_backup_dir" >> "$GITHUB_ENV"
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if pm2 describe ox-quiz-show > /dev/null 2>&1; then
              pm2 stop ox-quiz-show
            fi
            cp -a "$GITHUB_WORKSPACE/data" "$quiz_backup_dir/data"
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore only quiz data
        shell: bash
        run: |
          if [ -d "$QUIZ_DATA_BACKUP/data" ]; then
            cp -a "$QUIZ_DATA_BACKUP/data" "$GITHUB_WORKSPACE/data"
          fi

      - name: Install dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: Deploy with PM2
        run: |
          PORT=3000 pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save
