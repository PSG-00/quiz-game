name: Deploy to GCP Self-Hosted Runner

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: Deploy with PM2
        run: |
          PORT=3000 pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save
